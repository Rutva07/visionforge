[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionforge-pipeline"
version = "0.1.0"
description = "S3-backed image ingestion, deduplication, augmentation and vision model benchmarking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "numpy>=1.26,<3", "opencv-python-headless>=4.8", "Pillow>=10",
 "torch>=2.2", "torchvision>=0.17", "boto3>=1.34",
 "SQLAlchemy>=2.0", "psycopg[binary]>=3.1", "scikit-learn>=1.4",
 "tqdm>=4.66", "python-dotenv>=1.0"
]
[project.optional-dependencies]
test = ["pytest>=8", "moto[s3]>=5"]
[project.scripts]
visionforge = "visionforge.cli:main"
[tool.setuptools.packages.find]
include = ["visionforge*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
