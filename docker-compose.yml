services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visionforge
      POSTGRES_PASSWORD: visionforge
      POSTGRES_DB: visionforge
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionforge"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: visionforge
      MINIO_ROOT_PASSWORD: visionforge-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["s3_data:/data"]
  create-bucket:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 visionforge visionforge-dev-only;
      do sleep 2; done; mc mb --ignore-existing local/visionforge-images"
volumes:
  pg_data:
  s3_data:
